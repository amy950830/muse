name: Muse Autonomous Learning

on:
  workflow_dispatch:
    inputs:
      domain:
        description: Learning domain
        required: true
        type: choice
        options: [frontend, backend, security]
      dry_run:
        description: Validate without creating branches or pull requests
        required: true
        type: boolean
        default: true
      topic_override:
        description: Optional bounded topic override for testing
        required: false
        type: string
        default: ''
      candidate_limit:
        description: Candidate discovery limit (10-40)
        required: false
        type: string
        default: '30'
  schedule:
    - cron: '0 3 * * 1'
      timezone: 'Asia/Shanghai'
    - cron: '0 3 * * 3'
      timezone: 'Asia/Shanghai'
    - cron: '0 3 * * 5'
      timezone: 'Asia/Shanghai'

permissions: {}
concurrency:
  group: muse-learning-${{ github.event_name == 'workflow_dispatch' && inputs.domain || github.event.schedule }}
  cancel-in-progress: false
env:
  PYTHONUNBUFFERED: '1'

jobs:
  plan:
    if: github.event_name == 'workflow_dispatch' || vars.MUSE_LEARNING_SCHEDULE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: {contents: read}
    outputs:
      domain: ${{ steps.resolve.outputs.domain }}
      dry_run: ${{ steps.resolve.outputs.dry_run }}
      candidate_limit: ${{ steps.resolve.outputs.candidate_limit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: '${{ github.sha }}', persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - name: Resolve run context
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_DOMAIN: ${{ inputs.domain }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_TOPIC_OVERRIDE: ${{ inputs.topic_override }}
          INPUT_CANDIDATE_LIMIT: ${{ inputs.candidate_limit }}
        run: |
          set -euo pipefail
          mkdir -p research
          DOMAIN="$(python automation/learning/resolve_run.py --event-name "$EVENT_NAME" --schedule "$EVENT_SCHEDULE" --manual-domain "$INPUT_DOMAIN")"
          export DOMAIN
          python - <<'PY'
          import json, os
          from pathlib import Path
          event = os.environ['EVENT_NAME']
          raw = os.environ.get('INPUT_CANDIDATE_LIMIT', '') if event == 'workflow_dispatch' else '30'
          try: limit = int(raw or '30')
          except ValueError: raise SystemExit('candidate_limit must be an integer from 10 to 40')
          if not 10 <= limit <= 40: raise SystemExit('candidate_limit must be an integer from 10 to 40')
          context = {
              'domain': os.environ['DOMAIN'],
              'dry_run': os.environ.get('INPUT_DRY_RUN', 'true').lower() == 'true' if event == 'workflow_dispatch' else False,
              'topic_override': os.environ.get('INPUT_TOPIC_OVERRIDE', '').strip() if event == 'workflow_dispatch' else '',
              'candidate_limit': limit,
          }
          Path('research/run-context.json').write_text(json.dumps(context, indent=2, sort_keys=True) + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f"domain={context['domain']}\n")
              out.write(f"dry_run={'true' if context['dry_run'] else 'false'}\n")
              out.write(f"candidate_limit={context['candidate_limit']}\n")
          PY
      - name: Require Muse API key
        env: {META_API_KEY: '${{ secrets.META_API_KEY }}'}
        run: test -n "$META_API_KEY" || { echo 'META_API_KEY is required.' >&2; exit 2; }
      - name: Install Muse Code
        run: |
          set -euo pipefail
          curl -fsSL https://dev.meta.ai/install.sh | bash
          export PATH="$HOME/.local/bin:$HOME/bin:$PATH"
          muse --version
      - name: Select research topic with Muse
        env: {META_API_KEY: '${{ secrets.META_API_KEY }}'}
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$HOME/bin:$PATH"
          muse exec --trust-workspace --disable-approval --sandbox-network restricted --no-session-log --max-model-steps 10 --prompt-file automation/learning/prompts/plan-research.md
          git diff --quiet HEAD -- . || { echo 'Planning changed tracked repository files.' >&2; exit 1; }
          test -z "$(git ls-files --others --exclude-standard)" || { echo 'Planning created unauthorized files.' >&2; exit 1; }
          python automation/learning/secret_guard.py --secret-env META_API_KEY research/research-plan.json
      - name: Validate research plan
        run: python automation/learning/validate_research_plan.py research/research-plan.json --expected-domain '${{ steps.resolve.outputs.domain }}'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: research-plan
          path: |
            research/run-context.json
            research/research-plan.json
          if-no-files-found: error
          retention-days: 3

  collect:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: '${{ github.sha }}', persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with: {name: research-plan, path: research}
      - name: Collect bounded GitHub research
        env: {GITHUB_TOKEN: '${{ github.token }}'}
        run: |
          set -euo pipefail
          python automation/learning/collect_github_research.py research/research-plan.json --output-dir research/bundle --candidate-limit '${{ needs.plan.outputs.candidate_limit }}'
          python - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path('research/bundle/manifest.json').read_text())
          s = m.get('safety', {})
          if s.get('external_content_is_untrusted') is not True: raise SystemExit('untrusted-content boundary missing')
          if s.get('repository_code_executed') is not False: raise SystemExit('repository code execution indicated')
          if len(m.get('focused_sources', [])) < 2: raise SystemExit('fewer than two focused sources')
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with: {name: research-bundle, path: research/bundle, if-no-files-found: error, retention-days: 3}

  synthesize:
    needs: [plan, collect]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: {contents: read}
    outputs:
      level: ${{ steps.validate.outputs.level }}
      has_changes: ${{ steps.validate.outputs.has_changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: '${{ github.sha }}', persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with: {name: research-plan, path: research}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with: {name: research-bundle, path: research/bundle}
      - name: Require Muse API key
        env: {META_API_KEY: '${{ secrets.META_API_KEY }}'}
        run: test -n "$META_API_KEY" || { echo 'META_API_KEY is required.' >&2; exit 2; }
      - name: Install Muse Code
        run: |
          set -euo pipefail
          curl -fsSL https://dev.meta.ai/install.sh | bash
          export PATH="$HOME/.local/bin:$HOME/bin:$PATH"
          muse --version
      - name: Synthesize learning with Muse
        env: {META_API_KEY: '${{ secrets.META_API_KEY }}'}
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$HOME/bin:$PATH"
          muse exec --trust-workspace --disable-approval --sandbox-network restricted --no-session-log --max-model-steps 18 --prompt-file automation/learning/prompts/synthesize-learning.md
          UNEXPECTED="$({ git diff --name-only HEAD -- . ':(exclude)knowledge/**' ':(exclude)evolution/**'; git ls-files --others --exclude-standard -- . ':(exclude)knowledge/**' ':(exclude)evolution/**'; } | sed '/^$/d')"
          test -z "$UNEXPECTED" || { echo "Synthesis changed unauthorized repository paths: $UNEXPECTED" >&2; exit 1; }
          python automation/learning/secret_guard.py --secret-env META_API_KEY knowledge evolution research/evolution-decision.json
      - name: Validate decision and durable diff
        id: validate
        run: |
          set -euo pipefail
          python automation/learning/validate_evolution_decision.py research/evolution-decision.json
          { git diff --name-only HEAD -- knowledge evolution; git ls-files --others --exclude-standard -- knowledge evolution; } | sort -u > research/changed-files.txt
          python automation/learning/validate_learning_output.py --changed-files research/changed-files.txt
          python - <<'PY'
          import json
          from pathlib import Path
          paths = [x for x in Path('research/changed-files.txt').read_text().splitlines() if x]
          Path('research/changed-files.json').write_text(json.dumps(paths, indent=2) + '\n')
          PY
          git add -N -- knowledge evolution
          git diff --binary HEAD -- knowledge evolution > research/learning.patch
          test ! -s research/learning.patch || echo 'has_changes=true' >> "$GITHUB_OUTPUT"
          test -s research/learning.patch || echo 'has_changes=false' >> "$GITHUB_OUTPUT"
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          print('level=' + json.loads(Path('research/evolution-decision.json').read_text())['level'])
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: validated-learning
          path: |
            research/research-plan.json
            research/evolution-decision.json
            research/changed-files.json
            research/learning.patch
          if-no-files-found: error
          retention-days: 3

  publish_learning:
    needs: [plan, synthesize]
    if: ${{ needs.synthesize.outputs.has_changes == 'true' && needs.plan.outputs.dry_run == 'false' && github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {contents: write, pull-requests: write}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: '${{ github.sha }}', persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with: {name: validated-learning, path: research/publish}
      - name: Apply, revalidate, and publish learning PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DOMAIN: ${{ needs.plan.outputs.domain }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          git apply research/publish/learning.patch
          { git diff --name-only HEAD -- knowledge evolution; git ls-files --others --exclude-standard -- knowledge evolution; } | sort -u > research/publish/changed.txt
          python automation/learning/validate_learning_output.py --changed-files research/publish/changed.txt
          TOPIC="$(python -c "import json; print(json.load(open('research/publish/research-plan.json'))['topic'])")"
          DATE="$(TZ=Asia/Shanghai date +%F)"
          BRANCH="$(python -c 'import sys; from automation.learning.branch_names import learning_branch; print(learning_branch(*sys.argv[1:]))' "$DOMAIN" "$DATE" "$TOPIC")"
          git checkout -b "$BRANCH"
          git add -- knowledge evolution
          python automation/learning/validate_learning_output.py < <(git diff --cached --name-only)
          git config user.name muse-learning-bot
          git config user.email muse-learning-bot@users.noreply.github.com
          git commit -m "Learn: $DOMAIN / $TOPIC"
          gh auth setup-git
          git push origin "HEAD:$BRANCH"
          gh pr create --repo "$REPOSITORY" --base "$DEFAULT_BRANCH" --head "$BRANCH" --title "Muse learning: $DOMAIN / $TOPIC" --body "Autonomous learning output for **$DOMAIN / $TOPIC**. Validated knowledge/evolution paths only; never auto-merged. Workflow: $RUN_URL"

  draft_skill_candidate:
    needs: [plan, synthesize]
    if: ${{ needs.synthesize.outputs.level == 'L2' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: '${{ github.sha }}', persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with: {name: validated-learning, path: research}
      - name: Materialize validated proposal
        run: |
          set -euo pipefail
          test ! -s research/learning.patch || git apply research/learning.patch
          git add -N -- knowledge evolution
          git diff --binary HEAD -- knowledge evolution > research/pre-skill-learning.patch
      - name: Require Muse API key
        env: {META_API_KEY: '${{ secrets.META_API_KEY }}'}
        run: test -n "$META_API_KEY" || { echo 'META_API_KEY is required.' >&2; exit 2; }
      - name: Install Muse Code
        run: |
          set -euo pipefail
          curl -fsSL https://dev.meta.ai/install.sh | bash
          export PATH="$HOME/.local/bin:$HOME/bin:$PATH"
          muse --version
      - name: Draft review-only Skill candidate
        env: {META_API_KEY: '${{ secrets.META_API_KEY }}'}
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$HOME/bin:$PATH"
          muse exec --trust-workspace --disable-approval --sandbox-network restricted --no-session-log --max-model-steps 10 --prompt-file automation/learning/prompts/draft-skill-candidate.md
          git diff --binary HEAD -- knowledge evolution > research/post-skill-learning.patch
          cmp -s research/pre-skill-learning.patch research/post-skill-learning.patch || { echo 'Skill drafting changed validated learning content.' >&2; exit 1; }
          UNEXPECTED="$({ git diff --name-only HEAD -- . ':(exclude)knowledge/**' ':(exclude)evolution/**'; git ls-files --others --exclude-standard -- . ':(exclude)knowledge/**' ':(exclude)evolution/**'; } | sed '/^$/d')"
          test -z "$UNEXPECTED" || { echo "Skill drafting changed unauthorized repository paths: $UNEXPECTED" >&2; exit 1; }
          python automation/learning/secret_guard.py --secret-env META_API_KEY research/skill-candidate.json research/skill-candidate
      - name: Validate Skill candidate
        run: |
          set -euo pipefail
          TARGET="$(python -c "import json; print(json.load(open('research/skill-candidate.json'))['target_path'])")"
          python automation/learning/validate_skill_candidate.py research/skill-candidate.json research/skill-candidate/SKILL.md "$TARGET"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: skill-candidate
          path: |
            research/skill-candidate.json
            research/skill-candidate/SKILL.md
          if-no-files-found: error
          retention-days: 3

  publish_skill_candidate:
    needs: [plan, synthesize, draft_skill_candidate]
    if: ${{ needs.synthesize.outputs.level == 'L2' && needs.plan.outputs.dry_run == 'false' && github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {contents: write, pull-requests: write}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: '${{ github.sha }}', persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with: {name: skill-candidate, path: research/candidate-publish}
      - name: Revalidate and publish Skill candidate PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          META=research/candidate-publish/skill-candidate.json
          CANDIDATE=research/candidate-publish/skill-candidate/SKILL.md
          TARGET="$(python -c "import json; print(json.load(open('$META'))['target_path'])")"
          SKILL="$(python -c "import json; print(json.load(open('$META'))['target_skill'])")"
          PROPOSAL="$(python -c "import json; print(json.load(open('$META'))['proposal_path'])")"
          python automation/learning/validate_skill_candidate.py "$META" "$CANDIDATE" "$TARGET"
          cp "$CANDIDATE" "$TARGET"
          DATE="$(TZ=Asia/Shanghai date +%F)"
          TOPIC="$(basename "$PROPOSAL" .md)"
          BRANCH="$(python -c 'import sys; from automation.learning.branch_names import skill_branch; print(skill_branch(*sys.argv[1:]))' "$SKILL" "$DATE" "$TOPIC")"
          git checkout -b "$BRANCH"
          git add -- "$TARGET"
          CHANGED="$(git diff --cached --name-only)"
          test "$CHANGED" = "$TARGET" || { echo 'Skill publisher detected unexpected changed paths.' >&2; exit 1; }
          git config user.name muse-learning-bot
          git config user.email muse-learning-bot@users.noreply.github.com
          git commit -m "Propose Skill evolution: $SKILL"
          gh auth setup-git
          git push origin "HEAD:$BRANCH"
          gh pr create --repo "$REPOSITORY" --base "$DEFAULT_BRANCH" --head "$BRANCH" --title "Muse Skill candidate: $SKILL" --body "Review-only Skill candidate. Proposal: \`$PROPOSAL\`. Never auto-merged. Workflow: $RUN_URL"
